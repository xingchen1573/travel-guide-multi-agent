[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-guide-kernel"
version = "0.1.0"
description = "Shared route and workspace kernel for travel-guide runtimes"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
]

[tool.setuptools]
packages = ["travel_guide_kernel"]

[tool.setuptools.package-data]
travel_guide_kernel = ["py.typed"]
